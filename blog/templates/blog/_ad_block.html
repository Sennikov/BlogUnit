<div class="ad-block" data-ad-id="{{ ad.pk }}">

    {% if ad.type == 'text' %}
    <div class="rounded-2xl border border-blue-100 bg-blue-50/40 p-5 shadow-sm transition hover:border-blue-300">
        <p class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Реклама</p>
        <p class="text-sm leading-relaxed text-gray-700">{{ ad.text|linebreaksbr }}</p>
        {% if ad.url %}
        <a href="{{ ad.get_click_url }}" target="_blank" rel="nofollow noopener sponsored"
           class="mt-3 inline-flex items-center gap-1 text-sm font-semibold text-brand hover:underline">
            Перейти
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
        </a>
        {% endif %}
    </div>

    {% elif ad.type == 'image' %}
    <a href="{{ ad.get_click_url }}" target="_blank" rel="nofollow noopener sponsored"
       class="block overflow-hidden rounded-2xl border border-gray-200/80 bg-white shadow-sm transition hover:border-gray-300 hover:shadow-md">
        <img src="{{ ad.image.url }}"
             alt="{{ ad.image_alt|default:ad.title }}"
             class="block h-auto w-full object-cover">
    </a>

    {% elif ad.type == 'platform' %}
    <div class="ad-platform">
        {{ ad.html_code|safe }}
    </div>
    {% endif %}
</div>
