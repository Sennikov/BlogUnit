<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт на обслуживании — Unitproglab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-brand: #378ff6;
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex h-full items-center justify-center bg-gray-50 text-gray-900">
<div class="mx-4 max-w-md text-center">
    <!-- Иконка шестеренки -->
    <svg class="mx-auto h-20 w-20 text-brand animate-spin" style="animation-duration: 3s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
    </svg>

    <h1 class="mt-8 text-3xl font-extrabold tracking-tight text-gray-900">Сайт на обслуживании</h1>

    <p class="mt-4 text-base leading-relaxed text-gray-600">
        {{ message }}
    </p>

    <div class="mt-8 border-t border-gray-200 pt-6">
        <a href="{% url 'blog:home' %}" class="text-sm font-semibold text-brand hover:underline">
            Unitproglab
        </a>
        <p class="mt-1 text-xs text-gray-400">Спасибо за ваше терпение!</p>
    </div>
</div>
</body>
</html>
